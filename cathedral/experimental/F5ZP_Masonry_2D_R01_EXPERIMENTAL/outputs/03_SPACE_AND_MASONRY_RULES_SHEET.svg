  <g id="text_15">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start" x="63.36" y="35.64" transform="rotate(-0 63.36 35.64)">RESERVED SPACE FIRST  /  MASONRY ADDS OUTWARD</text>
  </g>
  <g id="text_16">
   <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start" x="80.64" y="375.84" transform="rotate(-0 80.64 375.84)">No extra full-height wall strips are placed on the internal arcade lines.</text>
  </g>
  <g id="text_17">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start" x="80.64" y="405" transform="rotate(-0 80.64 405)">Piers, responds and buttresses need their own bearing footprints. Wall thickness is not their diameter.</text>
  </g>
  <g id="text_18">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start" x="80.64" y="592.92" transform="rotate(-0 80.64 592.92)">Illustrative new set-out only: 2W + one shared wall + two outside walls = 3054.</text>
  </g>
  <g id="text_19">
   <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start" x="633.6" y="460.08" transform="rotate(-0 633.6 460.08)">AT AN EXISTING SHARED VAULT EDGE</text>
  </g>
  <g id="text_20">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(633.6 496.838437)">There is zero free strip between touching reserved cells.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(633.6 510.315781)">A positive wall cannot be inserted there while every</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(633.6 523.793125)">cell coordinate and full reservation remain fixed.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(633.6 537.270469)"/>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(633.6 550.747813)">Internal re-spacing is a separate architectural decision;</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(633.6 564.225156)">this study does not move the approved 14 vaults.</text>
  </g>
  <g id="text_21">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #b43c36" x="80.64" y="625.32" transform="rotate(-0 80.64 625.32)">EXPERIMENTAL • Plan-envelope dimensions are not floor-clearance or structural-capacity certification.</text>
  </g>
